name: PR Build

on:
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # Portable zip (per OS)
  # ---------------------------------------------------------------------------
  portable-zip:
    name: Portable zip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      - name: Package portable zip
        run: node scripts/package-portable.mjs --sha ${{ github.sha }}

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: poster-portable-${{ matrix.os }}-${{ github.sha }}
          path: dist/poster-portable-*.zip
          retention-days: 30
          if-no-files-found: error
