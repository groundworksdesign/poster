name: PR Build

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Default read-only; release jobs elevate contents: write.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Jest unit and integration coverage
  # ---------------------------------------------------------------------------
  unit-integration:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run unit and integration tests
        run: pnpm exec react-scripts test --watchAll=false --runInBand

  # ---------------------------------------------------------------------------
  # Remix Playwright E2E (Chromium; remix dev webServer)
  # ---------------------------------------------------------------------------
  remix-e2e:
    name: Remix E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app for process relaunch smoke
        run: pnpm run build:remix

      - name: Install Playwright Chromium (+ system deps)
        run: |
          set -euo pipefail
          # GitHub ubuntu images ship a google-chrome apt source that intermittently
          # 404/hash-mismatches and breaks `playwright install --with-deps`.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list || true
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 8))
          done
          exit 1

      - name: Run Remix E2E
        run: pnpm run test:e2e:remix

  # ---------------------------------------------------------------------------
  # Electron smoke (full process relaunch and durable theme preferences)
  # ---------------------------------------------------------------------------
  electron-smoke:
    name: Electron durable theme smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # GitHub-hosted runners cannot configure chrome-sandbox setuid; without this,
      # Electron aborts immediately with FATAL setuid_sandbox_host.
      ELECTRON_DISABLE_SANDBOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # pnpm 10 ignores dependency install scripts by default ("Ignored build scripts:
      # electron@…"), so Electron's postinstall never downloads the binary and
      # Playwright fails with "Electron failed to install correctly".
      # `pnpm rebuild electron` does not download either — run install.js directly.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Verify Electron binary
        run: |
          test -s node_modules/electron/path.txt
          test -x "$(node -p "require('electron')")"
          xvfb-run -a pnpm exec electron --version

      # Electron smoke launches Electron via Playwright's _electron API; it does not
      # need a Chromium browser download. Skipping `playwright install --with-deps`
      # avoids flaky google-chrome apt hash mismatches on GHA ubuntu images.

      - name: Run Electron relaunch smoke
        run: xvfb-run -a pnpm run test:e2e:electron

  # ---------------------------------------------------------------------------
  # Resolve PR pre-release tag (vX.Y.Z-pr.<PR_NUMBER>) and ensure GitHub Release
  # ---------------------------------------------------------------------------
  resolve-pr-release:
    name: Resolve PR pre-release
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve PR pre-release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER='${{ github.event.pull_request.number }}'
          BASE_VER=$(node -p "require('./package.json').version")
          TAG_NAME="v${BASE_VER}-pr.${PR_NUMBER}"
          SHORT_SHA=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)
          NOTES="Pre-release installer build for PR #${PR_NUMBER} (${SHORT_SHA}). Tag ${TAG_NAME} is updated on each push. On merge, a final release is published and this pre-release is deleted. macOS unsigned install: after copying Poster.app to Applications, run: xattr -cr /Applications/Poster.app then right-click Open. See docs/macos-install-unsigned.txt."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes "$NOTES" --prerelease --draft
          else
            gh release create "$TAG_NAME" --draft --prerelease --title "$TAG_NAME" \
              --notes "$NOTES" --target '${{ github.event.pull_request.head.sha }}'
          fi

          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Portable zip (per OS) — upload directly to the PR GitHub Release
  # ---------------------------------------------------------------------------
  portable-zip:
    name: Portable zip (${{ matrix.os }}) for ${{ needs.resolve-pr-release.outputs.version }}
    needs: [resolve-pr-release]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      - name: Build production node_modules (flat layout for portable zip)
        shell: bash
        run: |
          mkdir -p dist/portable-prod
          cp package.json pnpm-lock.yaml dist/portable-prod/
          cd dist/portable-prod
          pnpm install --prod --shamefully-hoist --frozen-lockfile
          pnpm rebuild better-sqlite3

      - name: Package portable zip
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          node scripts/package-portable.mjs \
            --sha "$SHORT_SHA" \
            --tag "${{ needs.resolve-pr-release.outputs.version }}" \
            --node-modules dist/portable-prod/node_modules

      - name: Upload portable zip to PR GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-pr-release.outputs.version }}'
          shopt -s nullglob
          files=(dist/poster-portable-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No portable zip found"
            exit 1
          fi
          gh release upload "$VERSION" "${files[@]}" --clobber

  # ---------------------------------------------------------------------------
  # Electron installers (per OS) — upload directly to the PR GitHub Release
  # ---------------------------------------------------------------------------
  electron-installers:
    name: Electron installers (${{ matrix.os }}) for ${{ needs.resolve-pr-release.outputs.version }}
    needs: [resolve-pr-release]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # Optional Apple signing/notarization. Missing secrets become "" in Actions;
      # build:electron → run-electron-builder.cjs strips blanks so electron-builder
      # does not treat the repo path as CSC_LINK (PR also skips sign via isPR).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      - name: Build Electron installers
        run: pnpm run build:electron

      - name: Stage installer files for release upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/electron-installers
          shopt -s nullglob
          files=(
            dist/electron/*.dmg
            dist/electron/*.exe
            dist/electron/*.deb
            dist/electron/*.AppImage
          )
          copied=0
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" dist/electron-installers/
              copied=$((copied + 1))
            fi
          done
          if [ "$copied" -eq 0 ]; then
            echo "No installer files found under dist/electron/"
            ls -la dist/electron || true
            exit 1
          fi
          ls -la dist/electron-installers/

      - name: Upload Electron installers to PR GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-pr-release.outputs.version }}'
          shopt -s nullglob
          files=(dist/electron-installers/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found"
            exit 1
          fi
          gh release upload "$VERSION" "${files[@]}" --clobber

  # ---------------------------------------------------------------------------
  # Finalize the PR pre-release (publish draft, list assets)
  # ---------------------------------------------------------------------------
  publish-pr-release:
    name: Publish ${{ needs.resolve-pr-release.outputs.version }}
    needs: [portable-zip, electron-installers, resolve-pr-release]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.resolve-pr-release.result == 'success' &&
      !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize PR pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-pr-release.outputs.version }}'
          gh release edit "$VERSION" --repo "${{ github.repository }}" --draft=false --prerelease
          echo "PR pre-release assets:"
          gh release view "$VERSION" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)"'
