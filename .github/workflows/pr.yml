name: PR Build

# Skip the full PR pipeline (unit/e2e/smoke + portable zip + Electron installers
# + publish) when the PR only touches docs/license/markdown. Any change to app
# code, tests, package manifests, build config, or .github/workflows/** still
# runs the normal jobs. workflow_dispatch always runs (no path filter).
on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "LICENSE.*"
      - "docs/**"
      - ".ralph/**"
      - "ralph/**"
  workflow_dispatch:

# Default read-only; release jobs elevate contents: write.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Jest unit and integration coverage
  # ---------------------------------------------------------------------------
  unit-integration:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run unit and integration tests
        run: pnpm exec react-scripts test --watchAll=false --runInBand

  # ---------------------------------------------------------------------------
  # Remix Playwright E2E (Chromium; remix dev webServer)
  # ---------------------------------------------------------------------------
  remix-e2e:
    name: Remix E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app for process relaunch smoke
        run: pnpm run build:remix

      - name: Install Playwright Chromium (+ system deps)
        run: |
          set -euo pipefail
          # GHA ubuntu images often include a google-chrome apt source that
          # intermittently Hash-Sum-mismatches and breaks `apt-get update` inside
          # `playwright install --with-deps`. Scrub any such sources first.
          sudo find /etc/apt -type f -print0 2>/dev/null \
            | xargs -0 grep -l 'dl.google.com/linux/chrome' 2>/dev/null \
            | xargs -r sudo rm -f || true
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google*.list || true
          sudo rm -rf /var/lib/apt/lists/* || true
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install --with-deps attempt ${attempt} failed; retrying..."
            sleep $((attempt * 8))
          done
          echo "Falling back to browser-only install (no apt --with-deps)"
          pnpm exec playwright install chromium

      - name: Run Remix E2E
        run: pnpm run test:e2e:remix

  # ---------------------------------------------------------------------------
  # Electron smoke (full process relaunch and durable theme preferences)
  # ---------------------------------------------------------------------------
  electron-smoke:
    name: Electron durable theme smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # GitHub-hosted runners cannot configure chrome-sandbox setuid; without this,
      # Electron aborts immediately with FATAL setuid_sandbox_host.
      ELECTRON_DISABLE_SANDBOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # pnpm 10 ignores dependency install scripts by default ("Ignored build scripts:
      # electron@…"), so Electron's postinstall never downloads the binary and
      # Playwright fails with "Electron failed to install correctly".
      # `pnpm rebuild electron` does not download either — run install.js directly.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Verify Electron binary
        run: |
          test -s node_modules/electron/path.txt
          test -x "$(node -p "require('electron')")"
          xvfb-run -a pnpm exec electron --version

      # Electron smoke launches Electron via Playwright's _electron API; it does not
      # need a Chromium browser download. Skipping `playwright install --with-deps`
      # avoids flaky google-chrome apt hash mismatches on GHA ubuntu images.

      - name: Run Electron relaunch smoke
        run: xvfb-run -a pnpm run test:e2e:electron

  # ---------------------------------------------------------------------------
  # Resolve PR pre-release tag (vX.Y.Z-pr.<PR_NUMBER>) and ensure GitHub Release.
  # Beta tag is next patch after max(package.json, latest non-prerelease Release)
  # so it never collides with a shipped final (e.g. main at 0.1.17 → v0.1.18-pr.N).
  # package.json on the PR branch is left untouched; Release-on-merge still bumps
  # from main's package.json as today.
  # ---------------------------------------------------------------------------
  resolve-pr-release:
    name: Resolve PR pre-release
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve PR pre-release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER='${{ github.event.pull_request.number }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          PKG_VER=$(node -p "require('./package.json').version")

          # Latest published non-draft, non-prerelease GitHub Release (ignore drafts / PR betas).
          LATEST_REL=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // empty' | sed 's/^v//')

          # max(package.json, latest final release), then bump patch → next PR beta base.
          BASE_VER=$(node -e "
            const pkg = process.argv[1];
            const rel = process.argv[2] || '';
            function parse(v) {
              const m = String(v).trim().match(/^(\d+)\.(\d+)\.(\d+)/);
              if (!m) return null;
              return [Number(m[1]), Number(m[2]), Number(m[3])];
            }
            function cmp(a, b) {
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] - b[i];
              }
              return 0;
            }
            const p = parse(pkg);
            if (!p) throw new Error('Invalid package.json version: ' + pkg);
            const r = rel ? parse(rel) : null;
            const base = r && cmp(r, p) > 0 ? r : p;
            base[2] += 1;
            process.stdout.write(base.join('.'));
          " "$PKG_VER" "$LATEST_REL")

          TAG_NAME="v${BASE_VER}-pr.${PR_NUMBER}"
          SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-7)
          NOTES="Pre-release installer build for PR #${PR_NUMBER} (${SHORT_SHA}). Tag ${TAG_NAME} is updated on each push. On merge, a final release is published and this pre-release is deleted. macOS unsigned install: after copying Poster.app to Applications, run: xattr -cr /Applications/Poster.app then right-click Open. See docs/macos-install-unsigned.txt."

          echo "package.json=${PKG_VER} latest_release=${LATEST_REL:-<none>} → ${TAG_NAME}"

          # Drop stale same-PR beta tags (e.g. v0.1.17-pr.23 after final v0.1.17 shipped)
          # so only the computed next-patch tag remains for this PR.
          SUFFIX="-pr.${PR_NUMBER}"
          gh api "/repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select((.tag_name | endswith(\"${SUFFIX}\")) and .tag_name != \"${TAG_NAME}\") | .id" \
            | while read -r id; do
              [ -n "${id}" ] || continue
              echo "Deleting stale PR pre-release id=${id}"
              gh api -X DELETE "/repos/${{ github.repository }}/releases/${id}" || true
            done
          for TAG in $(git ls-remote --tags origin "v*-pr.${PR_NUMBER}" | awk '{print $2}' | sed 's|refs/tags/||'); do
            if [ "$TAG" != "$TAG_NAME" ]; then
              echo "Deleting stale PR tag ${TAG}"
              gh api -X DELETE "/repos/${{ github.repository }}/git/refs/tags/${TAG}" || true
            fi
          done

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes "$NOTES" --prerelease --draft --target "$HEAD_SHA"
          else
            gh release create "$TAG_NAME" --draft --prerelease --title "$TAG_NAME" \
              --notes "$NOTES" --target "$HEAD_SHA"
          fi

          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Portable zip (per OS) — upload directly to the PR GitHub Release
  # ---------------------------------------------------------------------------
  portable-zip:
    name: Portable zip (${{ matrix.os }}) for ${{ needs.resolve-pr-release.outputs.version }}
    needs: [resolve-pr-release]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      - name: Build production node_modules (flat layout for portable zip)
        shell: bash
        run: |
          mkdir -p dist/portable-prod
          cp package.json pnpm-lock.yaml dist/portable-prod/
          cd dist/portable-prod
          pnpm install --prod --shamefully-hoist --frozen-lockfile
          pnpm rebuild better-sqlite3

      - name: Package portable zip
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          node scripts/package-portable.mjs \
            --sha "$SHORT_SHA" \
            --tag "${{ needs.resolve-pr-release.outputs.version }}" \
            --node-modules dist/portable-prod/node_modules

      - name: Upload portable zip to PR GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-pr-release.outputs.version }}'
          # Merge race: Release may have already deleted v*-pr.<N> while this job
          # was still building. Skip upload rather than fail on a missing target.
          if ! gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "PR pre-release $VERSION is gone (likely deleted after merge). Skipping upload."
            exit 0
          fi
          shopt -s nullglob
          files=(dist/poster-portable-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No portable zip found"
            exit 1
          fi
          gh release upload "$VERSION" "${files[@]}" --clobber

  # ---------------------------------------------------------------------------
  # Electron installers (per OS) — upload directly to the PR GitHub Release
  # ---------------------------------------------------------------------------
  electron-installers:
    name: Electron installers (${{ matrix.os }}) for ${{ needs.resolve-pr-release.outputs.version }}
    needs: [resolve-pr-release]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # Optional Apple signing/notarization. Missing secrets become "" in Actions;
      # build:electron → run-electron-builder.cjs strips blanks so electron-builder
      # does not treat the repo path as CSC_LINK (PR also skips sign via isPR).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      - name: Build Electron installers
        run: pnpm run build:electron

      - name: Stage installer files for release upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/electron-installers
          shopt -s nullglob
          # Installers plus electron-updater metadata when present (Win/Linux).
          files=(
            dist/electron/*.dmg
            dist/electron/*.exe
            dist/electron/*.deb
            dist/electron/*.AppImage
            dist/electron/*.blockmap
            dist/electron/latest.yml
            dist/electron/latest-linux.yml
          )
          copied=0
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" dist/electron-installers/
              copied=$((copied + 1))
            fi
          done
          if [ "$copied" -eq 0 ]; then
            echo "No installer files found under dist/electron/"
            ls -la dist/electron || true
            exit 1
          fi
          ls -la dist/electron-installers/

      - name: Upload Electron installers to PR GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-pr-release.outputs.version }}'
          # Merge race: Release may have already deleted v*-pr.<N> while this job
          # was still building. Skip upload rather than fail on a missing target.
          if ! gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "PR pre-release $VERSION is gone (likely deleted after merge). Skipping upload."
            exit 0
          fi
          shopt -s nullglob
          files=(dist/electron-installers/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found"
            exit 1
          fi
          gh release upload "$VERSION" "${files[@]}" --clobber

  # ---------------------------------------------------------------------------
  # Finalize the PR pre-release (publish draft, list assets)
  # ---------------------------------------------------------------------------
  publish-pr-release:
    name: Publish ${{ needs.resolve-pr-release.outputs.version }}
    needs: [portable-zip, electron-installers, resolve-pr-release]
    # always() keeps Finalize running when a matrix leg failed so we still undraft
    # whatever uploaded. Skip when the PR is already merged (event payload) so a
    # late/concurrent Publish does not race Release's PR pre-release cleanup.
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.merged != true &&
      needs.resolve-pr-release.result == 'success' &&
      !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize PR pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-pr-release.outputs.version }}'
          # Merge race: on PR merge, release.yml deletes v*-pr.<PR_NUMBER> while a
          # concurrent/late pr.yml Publish (uses always()) may still be running.
          # If the draft is already gone, succeed — do not fail the job.
          if ! gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "PR pre-release $VERSION not found (likely deleted after merge). Skipping finalize."
            exit 0
          fi
          gh release edit "$VERSION" --repo "${{ github.repository }}" --draft=false --prerelease
          echo "PR pre-release assets:"
          gh release view "$VERSION" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)"'
