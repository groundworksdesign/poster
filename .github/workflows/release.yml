name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

# Default: build jobs only read the repo. Publish and resolve-version elevate as needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Free artifact storage quota before staging release uploads (~28 GB backlog).
  # ---------------------------------------------------------------------------
  cleanup-old-artifacts:
    name: Cleanup old workflow artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while IFS= read -r id; do
            gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/${id}" && deleted=$((deleted + 1)) || true
          done < <(gh api "/repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[].id')
          echo "Deleted ${deleted} artifact(s)."

  # ---------------------------------------------------------------------------
  # Resolve the version: tag push → final release tag; main push → pre-release
  # with +semver: detection, package.json bump, and pre-release tag creation.
  # ---------------------------------------------------------------------------
  resolve-version:
    needs: [cleanup-old-artifacts]
    # Skip pre-release tags (vX.Y.Z-pr.N) — they are auto-created by the
    # main-branch flow and would only collide with a final-release run.
    if: github.ref_type != 'tag' || !contains(github.ref_name, '-pr.')
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      skip_build: ${{ steps.resolve.outputs.skip_build }}
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ '${{ github.ref_type }}' = 'tag' ]; then
            # -----------------------------------------------------------------
            # Tag push — final release. Use the tag name as-is.
            # Skip duplicate builds when the tag points at the automated
            # post-merge version-bump commit (main-branch run already built).
            # -----------------------------------------------------------------
            TAG_NAME='${{ github.ref_name }}'
            COMMIT_MSG=$(git log -1 --format=%B)
            if echo "$COMMIT_MSG" | grep -qE 'Bump version to .* \[skip ci\]'; then
              echo "skip_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip_build=false" >> "$GITHUB_OUTPUT"
            fi
            echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release create "$TAG_NAME" --draft --title "$TAG_NAME" --notes "Release assets building..."
            fi

          else
            # -----------------------------------------------------------------
            # Main push — final release. Detect +semver:, bump package.json,
            # commit [skip ci], push, create and push final release tag.
            # -----------------------------------------------------------------
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            CURRENT_VER=$(node -p "require('./package.json').version")

            # Find merged PR
            PR_NUMBER=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '.[0].number // empty')
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

            # PR body + merge commit body
            PR_BODY=""
            [ -n "$PR_NUMBER" ] && PR_BODY=$(gh api "/repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              --jq '.body // empty')
            COMMIT_MSG=$(git log --format=%B -n1 "${{ github.sha }}")

            ALL_TEXT=$(printf '%s\n%s' "$PR_BODY" "$COMMIT_MSG")
            BUMP="patch"
            if echo "$ALL_TEXT" | grep -qiE '\+semver:\s?(breaking|major)'; then
              BUMP="major"
            elif echo "$ALL_TEXT" | grep -qiE '\+semver:\s?(feature|minor)'; then
              BUMP="minor"
            fi

            # Apply bump — NOTE: post-increment in ((..)) returns the OLD value;
            # if old value is 0 the arithmetic exits with code 1, which trips
            # `set -e`. Use explicit arithmetic instead.
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VER"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
            TAG_NAME="v${NEW_VER}"

            # Write version to package.json
            node -e "
              const p = require('./package.json');
              p.version = '$NEW_VER';
              require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "

            # Commit [skip ci] and push
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add package.json
            git commit -m "Bump version to $NEW_VER [skip ci]"
            git push origin "refs/heads/${{ github.ref_name }}"

            # Create and push final release tag
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"

            gh release create "$TAG_NAME" --draft --title "$TAG_NAME" --notes "Release assets building..."

            echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Portable zip (per OS) — same steps as PR Build, uses resolved version
  # ---------------------------------------------------------------------------
  portable-zip:
    name: Portable zip (${{ matrix.os }}) for ${{ needs.resolve-version.outputs.version }}
    needs: [resolve-version]
    if: needs.resolve-version.outputs.skip_build != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.commit_sha || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      - name: Build production node_modules (flat layout for portable zip)
        shell: bash
        run: |
          mkdir -p dist/portable-prod
          cp package.json pnpm-lock.yaml dist/portable-prod/
          cd dist/portable-prod
          pnpm install --prod --shamefully-hoist --frozen-lockfile
          pnpm rebuild better-sqlite3

      - name: Package portable zip
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          node scripts/package-portable.mjs \
            --sha "$SHORT_SHA" \
            --tag "${{ needs.resolve-version.outputs.version }}" \
            --node-modules dist/portable-prod/node_modules

      - name: Upload portable zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-version.outputs.version }}'
          shopt -s nullglob
          files=(dist/poster-portable-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No portable zip found"
            exit 1
          fi
          gh release upload "$VERSION" "${files[@]}" --clobber

  # ---------------------------------------------------------------------------
  # Electron installers (per OS)
  # ---------------------------------------------------------------------------
  electron-installers:
    name: Electron installers (${{ matrix.os }}) for ${{ needs.resolve-version.outputs.version }}
    needs: [resolve-version]
    if: needs.resolve-version.outputs.skip_build != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    env:
      # Prefer unsigned/ad-hoc when Apple secrets are absent. Empty CSC_LINK from
      # missing secrets is stripped by scripts/run-electron-builder.cjs (empty
      # CSC_LINK makes electron-builder treat the repo path as a cert file).
      CSC_IDENTITY_AUTO_DISCOVERY: false
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.commit_sha || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for runner OS
        run: pnpm rebuild better-sqlite3

      - name: Build Remix app
        run: pnpm run build:remix

      # --publish never is baked into build:electron (electron-builder v26
      # otherwise auto-publishes in CI). prepare-electron-pack.cjs ships a slim
      # runtime node_modules tree into the app. run-electron-builder.cjs clears
      # blank CSC_* so mac Release matches PR unsigned/ad-hoc behavior.
      - name: Build Electron installers
        run: pnpm run build:electron

      - name: Stage installer files for release upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/electron-installers
          shopt -s nullglob
          files=(
            dist/electron/*.dmg
            dist/electron/*.exe
            dist/electron/*.deb
            dist/electron/*.AppImage
          )
          copied=0
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" dist/electron-installers/
              copied=$((copied + 1))
            fi
          done
          if [ "$copied" -eq 0 ]; then
            echo "No installer files found under dist/electron/"
            ls -la dist/electron || true
            exit 1
          fi
          ls -la dist/electron-installers/

      - name: Upload Electron installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-version.outputs.version }}'
          shopt -s nullglob
          files=(dist/electron-installers/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found"
            exit 1
          fi
          gh release upload "$VERSION" "${files[@]}" --clobber

  # ---------------------------------------------------------------------------
  # Finalize the GitHub Release (pre-release or final)
  # ---------------------------------------------------------------------------
  publish:
    # Always run as long as version resolution succeeded, even if individual
    # build jobs (e.g. electron-installers) failed — we publish whatever was
    # built successfully. Skip when a duplicate tag-push run is suppressed.
    if: >-
      always() &&
      needs.resolve-version.result == 'success' &&
      needs.resolve-version.outputs.skip_build != 'true' &&
      !cancelled()
    name: Publish ${{ needs.resolve-version.outputs.version }}
    needs: [portable-zip, electron-installers, resolve-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete merged PR pre-releases (final release only)
        if: >-
          needs.resolve-version.outputs.is_prerelease == 'false' &&
          needs.resolve-version.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER='${{ needs.resolve-version.outputs.pr_number }}'
          SUFFIX="-pr.${PR_NUMBER}"
          echo "Cleaning up PR pre-releases for PR #${PR_NUMBER} (tags ending with ${SUFFIX})"

          # Use endswith — avoid jq regex escapes (test("…\\.") broke undraft).
          gh api "/repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name | endswith(\"${SUFFIX}\")) | .id" \
            | while read -r id; do
              [ -n "${id}" ] || continue
              echo "  Deleting release $id"
              gh api -X DELETE "/repos/${{ github.repository }}/releases/$id" || true
            done

          for TAG in $(git ls-remote --tags origin "v*-pr.${PR_NUMBER}" | awk '{print $2}' | sed 's|refs/tags/||'); do
            echo "  Deleting tag $TAG"
            gh api -X DELETE "/repos/${{ github.repository }}/git/refs/tags/${TAG}" || true
          done

      - name: Finalize GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve-version.outputs.version }}'
          gh release edit "$VERSION" --draft=false
          echo "Release assets:"
          gh release view "$VERSION" --json assets --jq '.assets[] | "\(.name): \(.browser_download_url)"'
