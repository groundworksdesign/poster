appId: com.groundworksdesign.poster
productName: Poster

# Disable the auto-detected react-cra preset: this project uses a custom
# electron/main.cjs entry (not the CRA public/electron.js convention).
extends: null

# Packaging note: electron/main.cjs spawns a child Node.js process to run
# server/index.js. The current implementation launches Electron's bundled Node
# (process.execPath), so native modules must be rebuilt for Electron's ABI.
# npmRebuild: true instructs electron-builder to rebuild native modules for
# Electron during packaging. CI should run `pnpm install --production` then
# `pnpm rebuild` as needed before packaging for reproducible artifacts.
npmRebuild: true

# Disable packing into asar so the child Node process can access server files
# and native modules on disk (avoids requiring asar unpack patterns).
asar: false

# Output directory (kept separate from portable-zip dist/)
directories:
  output: dist/electron

# Artifact naming: app-version-os-arch.ext
# On PR matrix each OS leg produces a unique name automatically.
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

# Files to include in the packaged app
# electron-builder prunes to production deps by default; include node_modules explicitly
files:
  - electron/**
  - server/**
  - build/**
  - public/**
  - package.json
  - node_modules/**
  - "!src/**"
  - "!e2e/**"
  - "!scripts/**"
  - "!docs/**"
  - "!*.spec.*"
  - "!*.test.*"
  - "!playwright.config.*"
  - "!remix.config.*"
  - "!tsconfig*"
  - "!.github/**"

# ---- Per-platform targets ----

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

# DMG window settings (top-level, not under mac)
dmg:
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Use existing favicon.ico if present
  installerIcon: public/favicon.ico
  uninstallerIcon: public/favicon.ico

linux:
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  # Required for .deb
  maintainer: Groundworks Design
  category: Office
